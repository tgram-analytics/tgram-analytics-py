name: Publish to PyPI

# Fires automatically when a GitHub release is published. To cut a new
# version: bump the version in pyproject.toml + src/tgram_analytics/__init__.py
# + CHANGELOG.md, merge, then create a release at
# github.com/<org>/<repo>/releases/new — this workflow does the rest.
#
# Auth: PyPI Trusted Publishing (OIDC). One-time setup on PyPI:
#   https://docs.pypi.org/trusted-publishers/
# Project: tgram-analytics
# Owner:   tgram-analytics
# Repo:    tgram-analytics-py
# Workflow: publish.yml
# Environment: pypi
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bound to the GitHub Environment named "pypi" — required by the
    # PyPI trusted-publishing config. Configure it under
    # Settings → Environments → New environment → "pypi".
    environment:
      name: pypi
      url: https://pypi.org/p/tgram-analytics
    permissions:
      id-token: write  # required for OIDC token exchange with PyPI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]" build

      - name: Verify pyproject version matches the release tag
        run: |
          PKG_VERSION="v$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          REL_TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$REL_TAG" ]; then
            echo "::error::pyproject.toml version ($PKG_VERSION) does not match release tag ($REL_TAG). Bump the version before cutting a release."
            exit 1
          fi

      - name: Run tests
        run: pytest

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing — no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
